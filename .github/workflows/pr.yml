name: PR

on:
  workflow_dispatch:
  pull_request:
    paths:
    - '.github/workflows/**'
    - 'Directory.*'
    - 'global.json'
    - 'src/**'
    - 'E2E/**'
    - 'samples/**'
    - 'tests/**'

jobs:
  build:
    uses: avantipoint/workflow-templates/.github/workflows/msbuild-build.yml@master
    with:
      name: Build Mobile.BuildTools
      solution-path: Mobile.BuildTools.sln
      submodules: true
      dotnet-version: 8.0.421
      install-workload: 'maui macos maui-tizen'
      vs-version: 17.12

  sample-appmanifests:
    name: Build AppManifests sample
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.421
            10.0.300

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
        working-directory: samples/AppManifestsSample

      - name: Build AppManifests package
        run: dotnet build src/Mobile.BuildTools.AppManifests/Mobile.BuildTools.AppManifests.csproj -v minimal

      - name: Resolve AppManifests package version
        shell: pwsh
        run: |
          $package = Get-ChildItem Artifacts -Filter 'Mobile.BuildTools.AppManifests.*.nupkg' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $package) { throw 'Mobile.BuildTools.AppManifests package was not produced.' }
          $version = $package.BaseName -replace '^Mobile\.BuildTools\.AppManifests\.', ''
          "MBT_APPMANIFESTS_VERSION=$version" >> $env:GITHUB_ENV

      - name: Restore AppManifests sample
        run: MSBuild.exe AppManifestsSample/AppManifestsSample.csproj -t:Restore -p:TargetFramework=net10.0-android -p:TargetFrameworks=net10.0-android -p:MobileBuildToolsAppManifestsVersion=$env:MBT_APPMANIFESTS_VERSION -v:minimal
        working-directory: samples/AppManifestsSample

      # NOTE: A full Android `Build` of the sample requires a fix in the
      # Mobile.BuildTools.AppManifests packaging path (Reference.dll is not
      # discoverable for the TemplateManifestTask on .NET 10). That packaging
      # fix is tracked in a separate PR (fix/appmanifests-engine) per Dan's
      # direction so PR #364 stays scoped to the sample + CI coverage. Once
      # that PR merges, re-add an Android `Build` step here.

      - name: Validate iOS plist source
        shell: python
        run: |
          import plistlib
          with open(r'AppManifestsSample/Platforms/iOS/Info.plist', 'rb') as f:
              plistlib.load(f)

  e2e:
    needs: [build]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download NuGet Artifacts
        uses: actions/download-artifact@v4
        with:
          name: NuGet
          path: Artifacts

      - name: Run Tests
        run: dotnet test -c Release
        working-directory: E2E/E2E.Tests
        env:
          AString: 'Hello World!'
          AnInt: 5
          ADouble: 3.14
          ABool: false
          AFloat: 4.2
          ADate: 'January 1, 2020'
          AUri: 'https://mobilebuildtools.com'
          AStringArray: 'Foo;Bar;Baz'
          APlatformProperty: 'Should Not Exist'

