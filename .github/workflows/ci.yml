name: CI

on:
  push:
    branches: [master]
    paths:
    - 'Directory.*'
    - 'global.json'
    - 'src/**'
    - 'E2E/**'
    - 'samples/**'
    - 'tests/**'

jobs:
  build:
    uses: avantipoint/workflow-templates/.github/workflows/msbuild-build.yml@master
    with:
      name: Build Mobile.BuildTools
      solution-path: Mobile.BuildTools.sln
      submodules: true
      dotnet-version: 8.0.421
      install-workload: 'maui macos maui-tizen'
      vs-version: 17.12
      code-sign: true
    secrets:
      codeSignKeyVault: ${{ secrets.CodeSignKeyVault }}
      codeSignClientId: ${{ secrets.CodeSignClientId }}
      codeSignTenantId: ${{ secrets.CodeSignTenantId }}
      codeSignClientSecret: ${{ secrets.CodeSignClientSecret }}
      codeSignCertificate: ${{ secrets.CodeSignCertificate }}

  sample-appmanifests:
    name: Build AppManifests sample
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.421
            10.0.300

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
        working-directory: samples/AppManifestsSample

      - name: Build AppManifests package
        run: dotnet build src/Mobile.BuildTools.AppManifests/Mobile.BuildTools.AppManifests.csproj -v minimal

      - name: Restore AppManifests sample
        run: dotnet restore AppManifestsSample/AppManifestsSample.csproj -p:TargetFrameworks=net10.0-android -v minimal /p:BaseIntermediateOutputPath=obj-ci/ /p:BaseOutputPath=bin-ci/
        working-directory: samples/AppManifestsSample

      - name: Build AppManifests sample Android head
        run: dotnet build AppManifestsSample/AppManifestsSample.csproj -f net10.0-android --no-restore -p:TargetFrameworks=net10.0-android -v minimal /p:BaseIntermediateOutputPath=obj-ci/ /p:BaseOutputPath=bin-ci/
        working-directory: samples/AppManifestsSample

      - name: Validate iOS plist source
        shell: python
        run: |
          import plistlib
          with open(r'AppManifestsSample/Platforms/iOS/Info.plist', 'rb') as f:
              plistlib.load(f)

  deploy-internal:
    uses: avantipoint/workflow-templates/.github/workflows/deploy-nuget.yml@master
    needs: [build, sample-appmanifests]
    if: ${{ github.event_name == 'push' }}
    with:
      name: Deploy Internal
    secrets:
      feedUrl: ${{ secrets.IN_HOUSE_NUGET_FEED }}
      apiKey: ${{ secrets.IN_HOUSE_API_KEY }}

  deploy-sponsors:
    uses: avantipoint/workflow-templates/.github/workflows/deploy-nuget.yml@master
    needs: [build, sample-appmanifests]
    if: ${{ github.event_name == 'push' }}
    with:
      name: Deploy Sponsor Connect
    secrets:
      feedUrl: ${{ secrets.SPONSOR_CONNECT_NUGET_FEED }}
      apiKey: ${{ secrets.SPONSOR_CONNECT_TOKEN }}
